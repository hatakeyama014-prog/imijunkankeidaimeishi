<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>意味順ドロップ（関係代名詞編）</title>
  <style>
    body { font-family: sans-serif; background: #2c3e50; color: #fff; text-align: center; margin: 0; padding: 15px; user-select: none; }
    h1 { margin: 10px 0; font-size: 1.5rem; }
    
    .status-bar { display: flex; justify-content: space-between; max-width: 500px; margin: 0 auto 10px; font-weight: bold; font-size: 1.1rem; }
    .timer { color: #e74c3c; }
    .score { color: #2ecc71; }

    /* ゲームエリア（落下エリア） */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 320px;
      background: #1a252f;
      margin: 0 auto 15px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #34495e;
    }

    .jp-question {
      padding: 10px;
      background: #34495e;
      font-weight: bold;
      font-size: 0.95rem;
    }

    /* 落ちてくる単語ブロック */
    .falling-block {
      position: absolute;
      background: #e67e22;
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }
    .falling-block:active { transform: scale(0.95); }

    /* 意味順ドロップゾーン */
    .target-zones { display: flex; gap: 5px; max-width: 500px; margin: 0 auto; }
    .zone {
      flex: 1;
      background: #34495e;
      padding: 10px 5px;
      border-radius: 8px;
      font-size: 0.8rem;
      min-height: 80px;
      border: 2px dashed #7f8c8d;
    }
    .zone-title { font-weight: bold; color: #f1c40f; margin-bottom: 5px; }
    .zone-content { display: flex; flex-direction: column; gap: 5px; }
    .placed-item { background: #27ae60; padding: 4px; border-radius: 4px; font-size: 0.75rem; }

    button.start-btn {
      padding: 12px 30px;
      font-size: 1.2rem;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>意味順ドロップ（関係代名詞）</h1>

  <div class="status-bar">
    <div class="timer">⏱️ 残り: <span id="time">30</span>秒</div>
    <div class="score">⭐ スコア: <span id="score">0</span></div>
  </div>

  <div id="game-container">
    <div class="jp-question" id="jpQuestion">「START」を押してゲームを開始しよう！</div>
  </div>

  <!-- 意味順ボックス -->
  <div class="target-zones">
    <div class="zone" onclick="dropToZone('主語')">
      <div class="zone-title">① だれが/何が</div>
      <div class="zone-content" id="zone-主語"></div>
    </div>
    <div class="zone" onclick="dropToZone('修飾')">
      <div class="zone-title">② どんな人/物か<br>(関係代名詞)</div>
      <div class="zone-content" id="zone-修飾"></div>
    </div>
    <div class="zone" onclick="dropToZone('動詞')">
      <div class="zone-title">③ する/です</div>
      <div class="zone-content" id="zone-動詞"></div>
    </div>
    <div class="zone" onclick="dropToZone('補語目的語')">
      <div class="zone-title">④ だれ・なに</div>
      <div class="zone-content" id="zone-補語目的語"></div>
    </div>
  </div>

  <button class="start-btn" id="startBtn" onclick="startGame()">ゲームスタート！</button>

  <script>
    const questions = [
      { jp: "公園で走っている男の子は私の友達です", word: "who is running", cat: "修飾" },
      { jp: "公園で走っている男の子は私の友達です", word: "The boy", cat: "主語" },
      { jp: "公園で走っている男の子は私の友達です", word: "is", cat: "動詞" },
      { jp: "公園で走っている男の子は私の友達です", word: "my friend", cat: "補語目的語" },
      { jp: "私が昨日会った先生は親切です", word: "whom I met yesterday", cat: "修飾" },
      { jp: "私が昨日会った先生は親切です", word: "The teacher", cat: "主語" }
    ];

    let timer = null;
    let spawnTimer = null;
    let timeLeft = 30;
    let score = 0;
    let selectedBlock = null;

    function startGame() {
      score = 0;
      timeLeft = 30;
      document.getElementById('score').innerText = score;
      document.getElementById('time').innerText = timeLeft;
      document.getElementById('startBtn').style.display = 'none';
      
      clearZones();

      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time').innerText = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);

      spawnTimer = setInterval(spawnWord, 1800);
      spawnWord();
    }

    function spawnWord() {
      const q = questions[Math.floor(Math.random() * questions.length)];
      document.getElementById('jpQuestion').innerText = "問題: 「" + q.jp + "」";

      const container = document.getElementById('game-container');
      const el = document.createElement('div');
      el.className = 'falling-block';
      el.innerText = q.word;
      el.dataset.cat = q.cat;

      const startX = Math.random() * (container.clientWidth - 120);
      el.style.left = startX + 'px';
      el.style.top = '40px';

      el.onclick = function() {
        if (selectedBlock) selectedBlock.style.outline = 'none';
        selectedBlock = el;
        el.style.outline = '3px solid #f1c40f';
      };

      container.appendChild(el);

      // 落下アニメーション
      let pos = 40;
      const fallInterval = setInterval(() => {
        if (timeLeft <= 0 || !el.parentElement) {
          clearInterval(fallInterval);
          return;
        }
        pos += 2;
        el.style.top = pos + 'px';

        if (pos > container.clientHeight - 40) {
          clearInterval(fallInterval);
          if (el.parentElement) el.remove();
        }
      }, 5
