<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>意味順ドロップ - 関係代名詞編 (音声読み上げ付き)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-container {
      width: 100%;
      max-width: 460px;
      height: 92vh;
      max-height: 780px;
      background: #161b22;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      border: 1px solid #30363d;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
    }
    .home-icon {
      width: 32px;
      height: 32px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 14px;
    }
    .status-group { display: flex; gap: 12px; font-weight: bold; font-size: 13px; color: #8b949e; }
    .status-group span { color: #58a6ff; font-size: 16px; margin-left: 4px; }
    .hearts { color: #ff7b72; font-size: 18px; letter-spacing: 2px; }

    .target-box {
      text-align: center;
      margin-top: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid #30363d;
      padding: 10px;
      border-radius: 12px;
    }
    .target-label { font-size: 11px; color: #8b949e; margin-bottom: 2px; }
    .target-text { font-size: 17px; font-weight: bold; color: #f0f6fc; }

    .drop-stage {
      flex: 1;
      position: relative;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 14px;
      margin: 12px 0;
      overflow: hidden;
      border: 1px dashed #21262d;
    }

    .falling-card {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 0;
      background: #f0f6fc;
      color: #0d1117;
      font-size: 18px;
      font-weight: 800;
      padding: 10px 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(255,255,255,0.15);
      white-space: nowrap;
      text-align: center;
      z-index: 5;
    }

    .slots-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .slot-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 110px;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .slot-box:active { transform: scale(0.96); background: #161b22; }

    .slot-header {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
    }
    .slot-num { font-size: 11px; color: #8b949e; }
    .slot-badge {
      font-size: 12px;
      font-weight: bold;
      padding: 2px 10px;
      border-radius: 12px;
      color: white;
    }
    .bg-1 { background-color: #f78166; }
    .bg-2 { background-color: #2ea043; }
    .bg-4 { background-color: #d29922; }

    .slot-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
      font-size: 11px;
      color: #484f58;
    }
    .placed-item {
      background: #21262d;
      color: #58a6ff;
      padding: 3px 6px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      text-align: center;
      width: 100%;
      word-break: break-word;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(13, 17, 23, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 20;
    }
    .overlay h2 { font-size: 26px; color: #58a6ff; }
    .btn-main {
      background: #238636;
      color: white;
      padding: 12px 28px;
      border-radius: 10px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="header">
    <div class="home-icon">⌂</div>
    <div class="status-group">
      <div>LV <span id="level">1</span></div>
      <div>SCORE <span id="score">0</span></div>
    </div>
    <div class="hearts" id="hearts">♥♥♥</div>
  </div>

  <div class="target-box">
    <div class="target-label">この文をつくろう (音声機能ON)</div>
    <div class="target-text" id="jp-sentence">---</div>
  </div>

  <div class="drop-stage" id="stage">
    <div class="falling-card" id="card" style="display:none;">---</div>
  </div>

  <div class="slots-container">
    <div class="slot-box" onclick="handleInput(1)">
      <div class="slot-header">
        <span class="slot-num">1</span>
        <span class="slot-badge bg-1">だれが</span>
      </div>
      <div class="slot-content" id="slot-1">·····</div>
    </div>

    <div class="slot-box" onclick="handleInput(2)">
      <div class="slot-header">
        <span class="slot-num">2</span>
        <span class="slot-badge bg-2">する・です</span>
      </div>
      <div class="slot-content" id="slot-2">·····</div>
    </div>

    <div class="slot-box" onclick="handleInput(4)">
      <div class="slot-header">
        <span class="slot-num">4</span>
        <span class="slot-badge bg-4">なに</span>
      </div>
      <div class="slot-content" id="slot-4">·····</div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <h2 id="overlay-title">意味順ドロップ</h2>
    <p style="color:#8b949e;">関係代名詞編 (読み上げ付)</p>
    <button class="btn-main" onclick="startGame()">スタート</button>
  </div>
</div>

<script>
  // 音声読み上げ用関数
  function speakText(text, onEndCallback = null) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel(); // 前の発音を停止
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'en-US'; // 英語発音に設定
      uttr.rate = 0.9;     // 少しゆっくり聞きやすく
      if (onEndCallback) {
        uttr.onend = onEndCallback;
      }
      window.speechSynthesis.speak(uttr);
    } else if (onEndCallback) {
      onEndCallback();
    }
  }

  const questions = [
    {
      jp: "これが私たちが夏に行く海です。",
      sequence: [
        { text: "This", target: 1 },
        { text: "is", target: 2 },
        { text: "the sea that we go to in summer", target: 4 }
      ]
    },
    {
      jp: "私たちが夏に行く海は美しいです。",
      sequence: [
        { text: "The sea that we go to in summer", target: 1 },
        { text: "is", target: 2 },
        { text: "beautiful", target: 4 }
      ]
    },
    {
      jp: "あそこで走っている少年は健です。",
      sequence: [
        { text: "The boy who is running over there", target: 1 },
        { text: "is", target: 2 },
        { text: "Ken", target: 4 }
      ]
    }
  ];

  const distractors = ["He", "a book", "plays", "they"];

  let currentQIdx = 0;
  let currentTargetIdx = 0;
  let score = 0;
  let lives = 3;
  let dropInterval = null;
  let posY = 0;
  let currentCardData = null;
  const dropSpeed = 1.2;

  function startGame() {
    currentQIdx = 0;
    score = 0;
    lives = 3;
    document.getElementById("score").innerText = score;
    document.getElementById("overlay").style.display = "none";
    updateHearts();
    initQuestion();
  }

  function initQuestion() {
    if (currentQIdx >= questions.length) {
      endGame("全ステージクリア！");
      speakText("Congratulations! All stages cleared.");
      return;
    }

    document.getElementById("level").innerText = currentQIdx + 1;
    document.getElementById("jp-sentence").innerText = questions[currentQIdx].jp;
    currentTargetIdx = 0;

    [1, 2, 4].forEach(num => {
      document.getElementById(`slot-${num}`).innerHTML = '·····';
    });

    spawnNextCard();
  }

  function spawnNextCard() {
    clearInterval(dropInterval);
    const q = questions[currentQIdx];

    if (currentTargetIdx >= q.sequence.length) {
      // 1文完成！全文を読み上げてから次へ
      score += 100;
      document.getElementById("score").innerText = score;
      
      const fullSentence = q.sequence.map(item => item.text).join(" ");
      speakText(fullSentence, () => {
        currentQIdx++;
        initQuestion();
      });
      return;
    }

    const isDistractor = Math.random() < 0.3 && distractors.length > 0;

    if (isDistractor) {
      const randomDummy = distractors[Math.floor(Math.random() * distractors.length)];
      currentCardData = { text: randomDummy, targetSlot: null };
    } else {
      currentCardData = { 
        text: q.sequence[currentTargetIdx].text, 
        targetSlot: q.sequence[currentTargetIdx].target 
      };
    }

    const cardElem = document.getElementById("card");
    cardElem.innerText = currentCardData.text;
    cardElem.style.display = "block";
    posY = 0;
    cardElem.style.top = posY + "px";

    const stageHeight = document.getElementById("stage").clientHeight - 40;

    dropInterval = setInterval(() => {
      posY += dropSpeed;
      cardElem.style.top = posY + "px";

      if (posY >= stageHeight) {
        clearInterval(dropInterval);
        if (currentCardData.targetSlot !== null) {
          missAction();
        } else {
          spawnNextCard();
        }
      }
    }, 20);
  }

  function handleInput(selectedSlot) {
    if (!currentCardData) return;

    clearInterval(dropInterval);

    if (currentCardData.targetSlot === selectedSlot) {
      // 正解：単語を読み上げる
      speakText(currentCardData.text);

      score += 20;
      document.getElementById("score").innerText = score;

      const slotElem = document.getElementById(`slot-${selectedSlot}`);
      if (slotElem.innerText === '·····') slotElem.innerText = '';

      const div = document.createElement("div");
      div.className = "placed-item";
      div.innerText = currentCardData.text;
      slotElem.appendChild(div);

      currentTargetIdx++;
      spawnNextCard();
    } else {
      missAction();
    }
  }

  function missAction() {
    lives--;
    updateHearts();
    if (lives <= 0) {
      endGame("ゲームオーバー");
      speakText("Game over");
    } else {
      spawnNextCard();
    }
  }

  function updateHearts() {
    let hStr = "";
    for (let i = 0; i < lives; i++) hStr += "♥";
    document.getElementById("hearts").innerText = hStr || "―";
  }

  function endGame(msg) {
    clearInterval(dropInterval);
    document.getElementById("card").style.display = "none";
    document.getElementById("overlay-title").innerText = msg;
    document.getElementById("overlay").style.display = "flex";
  }
</script>

</body>
</html>
