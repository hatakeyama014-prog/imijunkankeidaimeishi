<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>意味順ドロップ（関係代名詞編）</title>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; padding: 20px; max-width: 800px; margin: 0 auto; color: #333; }
    h1 { text-align: center; color: #2c3e50; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .jp-text { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #2c3e50; }
    .drop-zone-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; padding: 15px; background: #eef2f5; border-radius: 8px; min-height: 60px; }
    .block-pool { display: flex; flex-wrap: wrap; gap: 10px; }
    .block { background: #3498db; color: white; padding: 10px 15px; border-radius: 6px; cursor: pointer; user-select: none; font-weight: bold; }
    .block.rel { background: #e67e22; }
    .block:hover { opacity: 0.9; }
    button { display: block; width: 100%; padding: 12px; font-size: 1rem; background: #2ecc71; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; }
    button:hover { background: #27ae60; }
    #result { margin-top: 15px; font-weight: bold; text-align: center; font-size: 1.1rem; }
  </style>
</head>
<body>

  <h1>意味順ドロップ（関係代名詞編）</h1>

  <div class="card">
    <div class="jp-text">問題: 「公園で走っている男の子は私の友達です。」</div>
    <p>下の単語ブロックをタップして、正しい順番で並べてみよう！</p>
    
    <div class="drop-zone-container" id="dropZone"></div>

    <div class="block-pool" id="blockPool">
      <div class="block" onclick="moveBlock(this)">The boy</div>
      <div class="block rel" onclick="moveBlock(this)">who</div>
      <div class="block" onclick="moveBlock(this)">is running</div>
      <div class="block" onclick="moveBlock(this)">in the park</div>
      <div class="block" onclick="moveBlock(this)">is</div>
      <div class="block" onclick="moveBlock(this)">my friend.</div>
    </div>

    <button onclick="checkAnswer()">答えあわせ</button>
    <div id="result"></div>
  </div>

  <script>
    function moveBlock(el) {
      const dropZone = document.getElementById('dropZone');
      const blockPool = document.getElementById('blockPool');
      if (el.parentElement === blockPool) {
        dropZone.appendChild(el);
      } else {
        blockPool.appendChild(el);
      }
    }

    function checkAnswer() {
      const dropZone = document.getElementById('dropZone');
      const userOrder = Array.from(dropZone.children).map(child => child.innerText.trim()).join(' ');
      const correctAnswer = "The boy who is running in the park is my friend.";
      const resultDiv = document.getElementById('result');

      if (userOrder === correctAnswer) {
        resultDiv.style.color = "#2ecc71";
        resultDiv.innerText = "🎉 正解です！完璧！";
      } else {
        resultDiv.style.color = "#e74c3c";
        resultDiv.innerText = "❌ おしい！もう一度順番を確かめてみよう。";
      }
    }
  </script>

</body>
</html>
