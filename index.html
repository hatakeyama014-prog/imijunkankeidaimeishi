  <!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>意味順ドロップ - 関係代名詞編</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Main Container */
    .game-container {
      width: 100%;
      max-width: 500px;
      height: 95vh;
      max-height: 850px;
      background: #111827;
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Header Component */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .home-btn {
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 16px;
      color: #9ca3af;
    }
    .badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #9ca3af;
    }
    .badge span { color: #f3f4f6; margin-left: 4px; }
    .hearts { color: #ef4444; font-size: 20px; letter-spacing: 2px; }

    /* Target Sentence Box */
    .target-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
    }
    .target-title { font-size: 12px; color: #9ca3af; margin-bottom: 4px; }
    .target-text { font-size: 18px; font-weight: 700; color: #ffffff; }

    /* Main Play Area (Drop Stage) */
    .stage {
      flex: 1;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Falling Card Design */
    .card {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 0;
      background: #ffffff;
      color: #111827;
      font-size: 20px;
      font-weight: 800;
      padding: 12px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      white-space: nowrap;
      text-align: center;
      z-index: 10;
    }

    /* Bottom Boxes (Slots) */
    .slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .slot {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 120px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .slot:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.08);
    }
    .slot-num {
      align-self: flex-start;
      font-size: 11px;
      color: #6b7280;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .pill {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
      color: white;
      margin-bottom: 8px;
    }
    .pill-1 { background-color: #ec4899; } /* だれが */
    .pill-2 { background-color: #0ea5e9; } /* する・です */
    .pill-4 { background-color: #a855f7; } /* なに */

    .slot-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
      font-size: 11px;
      color: #4b5563;
    }
    .placed-word {
      background: rgba(255, 255, 255, 0.1);
      color: #38bdf8;
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      text-align: center;
      width: 100%;
      word-break: break-word;
    }

    /* Overlay Screen */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.95);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 30;
    }
    .overlay h2 { font-size: 28px; color: #ffffff; font-weight: 800; }
    .btn-start {
      background: #3b82f6;
      color: white;
      padding: 14px 32px;
      border-radius: 12px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body>

<div class="game-container">
  <!-- Top Bar -->
  <div class="header">
    <div class="header-left">
      <div class="home-btn">⌂</div>
      <div class="badge">LV <span id="level">1</span></div>
      <div class="badge">SCORE <span id="score">0</span></div>
    </div>
    <div class="hearts" id="hearts">♥♥♥</div>
  </div>

  <!-- Target Sentence -->
  <div class="target-card">
    <div class="target-title">この文をつくろう</div>
    <div class="target-text" id="jp-sentence">---</div>
  </div>

  <!-- Drop Stage -->
  <div class="stage" id="stage">
    <div class="card" id="card" style="display:none;">---</div>
  </div>

  <!-- Slots -->
  <div class="slots">
    <div class="slot" onclick="handleInput(1)">
      <span class="slot-num">1</span>
      <span class="pill pill-1">だれが</span>
      <div class="slot-content" id="slot-1">·····</div>
    </div>

    <div class="slot" onclick="handleInput(2)">
      <span class="slot-num">2</span>
      <span class="pill pill-2">する・です</span>
      <div class="slot-content" id="slot-2">·····</div>
    </div>

    <div class="slot" onclick="handleInput(4)">
      <span class="slot-num">4</span>
      <span class="pill pill-4">なに</span>
      <div class="slot-content" id="slot-4">·····</div>
    </div>
  </div>

  <!-- Overlay Modal -->
  <div class="overlay" id="overlay">
    <h2 id="overlay-title">意味順ドロップ</h2>
    <p style="color: #9ca3af;">関係代名詞編</p>
    <button class="btn-start" onclick="startGame()">スタート</button>
  </div>
</div>

<script>
  // 音声読み上げ
  function speak(text, callback) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'en-US';
      uttr.rate = 0.9;
      if (callback) uttr.onend = callback;
      window.speechSynthesis.speak(uttr);
    } else if (callback) callback();
  }

  // 関係代名詞の問題
  const questions = [
    {
      jp: "これが私たちが夏に行く海です。",
      sequence: [
        { text: "This", target: 1 },
        { text: "is", target: 2 },
        { text: "the sea that we go to in summer", target: 4 }
      ]
    },
    {
      jp: "私たちが夏に行く海は美しいです。",
      sequence: [
        { text: "The sea that we go to in summer", target: 1 },
        { text: "is", target: 2 },
        { text: "beautiful", target: 4 }
      ]
    },
    {
      jp: "あそこで走っている少年は健です。",
      sequence: [
        { text: "The boy who is running over there", target: 1 },
        { text: "is", target: 2 },
        { text: "Ken", target: 4 }
      ]
    }
  ];

  const distractors = ["He", "a book", "the ball", "We"];

  let currentQIdx = 0;
  let currentTargetIdx = 0;
  let score = 0;
  let lives = 3;
  let dropTimer = null;
  let posY = 0;
  let currentCardData = null;

  function startGame() {
    currentQIdx = 0;
    score = 0;
    lives = 3;
    document.getElementById("score").innerText = score;
    document.getElementById("overlay").style.display = "none";
    updateHearts();
    initQuestion();
  }

  function initQuestion() {
    if (currentQIdx >= questions.length) {
      endGame("全ステージクリア！");
      speak("Congratulations!");
      return;
    }

    document.getElementById("level").innerText = currentQIdx + 1;
    document.getElementById("jp-sentence").innerText = questions[currentQIdx].jp;
    currentTargetIdx = 0;

    [1, 2, 4].forEach(n => document.getElementById(`slot-${n}`).innerText = '·····');

    spawnCard();
  }

  function spawnCard() {
    clearInterval(dropTimer);
    const q = questions[currentQIdx];

    if (currentTargetIdx >= q.sequence.length) {
      // 1文完成
      score += 100;
      document.getElementById("score").innerText = score;
      const fullSentence = q.sequence.map(i => i.text).join(" ");
      speak(fullSentence, () => {
        currentQIdx++;
        initQuestion();
      });
      return;
    }

    const isDistractor = Math.random() < 0.3;
    if (isDistractor) {
      const dummy = distractors[Math.floor(Math.random() * distractors.length)];
      currentCardData = { text: dummy, target: null };
    } else {
      currentCardData = q.sequence[currentTargetIdx];
    }

    const card = document.getElementById("card");
    card.innerText = currentCardData.text;
    card.style.display = "block";
    posY = 0;
    card.style.top = posY + "px";

    const stageHeight = document.getElementById("stage").clientHeight - 50;

    dropTimer = setInterval(() => {
      posY += 1.2;
      card.style.top = posY + "px";

      if (posY >= stageHeight) {
        clearInterval(dropTimer);
        if (currentCardData.target !== null) {
          miss();
        } else {
          spawnCard();
        }
      }
    }, 20);
  }

  function handleInput(selectedSlot) {
    if (!currentCardData) return;
    clearInterval(dropTimer);

    if (currentCardData.target === selectedSlot) {
      speak(currentCardData.text);
      score += 20;
      document.getElementById("score").innerText = score;

      const slotElem = document.getElementById(`slot-${selectedSlot}`);
      if (slotElem.innerText === '·····') slotElem.innerText = '';

      const div = document.createElement("div");
      div.className = "placed-word";
      div.innerText = currentCardData.text;
      slotElem.appendChild(div);

      currentTargetIdx++;
      spawnCard();
    } else {
      miss();
    }
  }

  function miss() {
    lives--;
    updateHearts();
    if (lives <= 0) {
      endGame("ゲームオーバー");
      speak("Game Over");
    } else {
      spawnCard();
    }
  }

  function updateHearts() {
    let h = "";
    for (let i = 0; i < lives; i++) h += "♥";
    document.getElementById("hearts").innerText = h || "―";
  }

  function endGame(title) {
    clearInterval(dropTimer);
    document.getElementById("card").style.display = "none";
    document.getElementById("overlay-title").innerText = title;
    document.getElementById("overlay").style.display = "flex";
  }
</script>

</body>
</html>
